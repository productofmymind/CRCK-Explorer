[package]
name = "rage-toolkit-app"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "crck-explorer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytemuck = "1.25.2"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
glam = "0.30"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
rage-toolkit-core = { path = "../rage-toolkit-core" }
rfd = "0.17.2"
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
# already in the tree (winit, wgpu): the shell calls that drag files out of the window
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
